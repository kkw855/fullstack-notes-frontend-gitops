apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fullstack-notes-lab-frontend-kotlin
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: notes-kotlin # 배포될 쿠버네티스 네임스페이스

  project: default

  source:
    # 💡 프론트엔드 전용 GitOps 레포지토리 주소 (kotlin 백엔드용 overlay)
    repoURL: https://github.com/kkw855/fullstack-notes-frontend-gitops.git
    targetRevision: HEAD
    path: overlays/kotlin

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
