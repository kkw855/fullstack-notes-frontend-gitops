apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notes-kotlin

resources:
  - ../../base
  - ingress.yaml

patches:
  - target:
      kind: Deployment
      name: notes-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "http://kotlin-api-service:5003/api"
