apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notes-scala

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: notes-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "http://scala-api-service:5002/api"
